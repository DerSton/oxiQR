name: Nightly

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: oxiqr

jobs:
  checks:
    uses: ./.github/workflows/rust-checks.yaml

  nightly:
    needs: checks
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release --locked

      - name: Prepare dist folder
        shell: bash
        run: |
          mkdir -p dist
          EXT=""
          if [ "${{ runner.os }}" = "Windows" ]; then EXT=".exe"; fi
          cp target/release/$BINARY_NAME$EXT dist/${BINARY_NAME}-${{ runner.os }}-${{ runner.arch }}$EXT

      - name: Create / update nightly prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "Nightly build"
          prerelease: true
          files: dist/*
          make_latest: false
