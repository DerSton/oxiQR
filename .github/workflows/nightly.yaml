name: Nightly

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: oxiqr

jobs:
  checks:
    uses: ./.github/workflows/rust-checks.yml

  nightly:
    needs: checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release --locked

      - name: Prepare dist folder
        run: |
          mkdir -p dist
          cp target/release/$BINARY_NAME dist/${BINARY_NAME}-linux-amd64

      - name: Create / update nightly prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "Nightly build"
          prerelease: true
          files: dist/*
          make_latest: false
